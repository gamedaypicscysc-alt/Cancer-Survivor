<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Cancer Awareness</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo"><a href="../">Hope & Support</a></div>
      <nav>
        <ul>
          <li><a href="../">Home</a></li>
          <li><a href="../journey/">Journey</a></li>
          <li><a href="../about-cancer/">About Cancer</a></li>
          <li><a href="../success-story/">Share Story</a></li>
          <li><a href="../testimonials/">Testimonials</a></li>
          <li><a href="../gallery/">Gallery</a></li>
          <li><a href="../resources/">Resources</a></li>
          <li><a href="../contact/">Contact</a></li>
        </ul>
      </nav>
      <div id="google_translate_element"></div>
    </div>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <p>Have questions or need assistance? Fill out the form below and we will get back to your email address.</p>

    <!-- Updated Formspree Endpoint -->
    <form action="https://formspree.io/f/xkjnkvjy" method="POST">
      <input type="hidden" name="_subject" value="New Direct Message from Contact Form">

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="Full Name">
      </div>

      <div class="form-group">
        <label for="email">Your Email Address</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="6" required placeholder="How can we help?"></textarea>
      </div>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; Cancer Awareness Initiative. All rights reserved.</p>
  </footer>

  <script src="../js/script.js"></script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
